name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci || npm install
      - name: Lint syntax
        run: npm run lint
      - name: Unit tests
        run: |
          set -a
          # shellcheck disable=SC1091
          source .env.ci
          set +a
          npm test
      - name: Seed check
        run: |
          set -a
          source .env.ci
          set +a
          npm run seed
