[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grolisto-python"
version = "0.1.0"
description = "Optional Python sidecars for Grolisto: LlamaIndex indexer and preference adapters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jrb00013" }]
dependencies = []

[project.optional-dependencies]
indexer = [
  "qdrant-client>=1.12.0",
  "httpx>=0.27.0",
]
adapters = [
  "numpy>=1.26.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[project.scripts]
grolisto-index = "grolisto_indexer.cli:main"
grolisto-export-adapter = "grolisto_adapters.export_tag_bias:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["grolisto_indexer*", "grolisto_adapters*"]

[tool.ruff]
line-length = 100
target-version = "py311"
